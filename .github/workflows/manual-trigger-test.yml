# .github/workflows/test.yml
name: Manual Test Trigger

on:
  push:
    branches: [ github-action-workflows ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      deploy_docs:
        description: 'Deploy documentation?'
        required: true
        type: boolean
        default: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  manual-trigger-job:
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome, firefox ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Setup GeckoDriver
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-geckodriver@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify GeckoDriver Version
        if: matrix.browser == 'firefox'
        run: geckodriver --version

      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Run tests on ${{ matrix.browser }} and Save the full state of run into the dump archive
        run: |
          npm install -g allure
          allure run --config allure3.js --environment=ubuntu-"${{ matrix.browser }}" --dump="allure-results-${{ matrix.browser }}" -- mvn clean verify -Dbrowser=${{ matrix.browser }} -Dheadless=yes -Durl=${{ secrets.BASE_URL }} -Demail=${{ secrets.USER_EMAIL }} -Dpassword=${{ secrets.USER_PASSWORD }}
      #      - name: Build test report
      #        if: always()
      #        run: |
      #          npm install -g allure
      #          allure generate target/allure-results --config allure3.js --output target/allure-report --clean
      #      - name: Generate a unified report from all dump archives
      #          if: always()
      #          run: allure generate --dump=stage_*.zip



      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.browser }}
          path: ./allure-results-${{ matrix.browser }}.zip
          compression-level: 0

#      - name: Upload Allure report history
#          if: always()
#          uses: actions/upload-artifact@v7
#          with:
#            name: allure-results-${{ matrix.browser }}
#            path: ./allure-results-${{ matrix.browser }}.zip
#            compression-level: 0
  report:
    runs-on: ubuntu-latest
    if: always()
    needs: manual-trigger-job
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v7
      # Checkout history from gh-pages branch
      - name: Get Allure history from gh-pages
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-history
      # ...

      # Fetching the dump archive for the Chrome test run
      - name: Download allure results from chrome
        uses: actions/download-artifact@v6
        with:
          name: allure-results-chrome
          path: ./

      # Fetching the dump archive for the Firefox test run
      - name: Download allure results from firefox
        uses: actions/download-artifact@v6
        with:
          name: allure-results-firefox
          path: ./

      - name: Extract dumps and restore history
        run: |
          mkdir -p target/allure-results
          unzip -o "allure-results-chrome.zip" -d target/allure-results
          unzip -o "allure-results-firefox.zip" -d target/allure-results
          if [ -d "gh-pages-history/history" ]; then
            echo "History restored successfully!"
          else
            echo "No previous history found. Starting fresh."
          fi
      - name: Build report
        # Building the multistage report from all fetched dump archives
        run: |
          npm install -g allure
          allure generate target/allure-results --config allure3.js --output=target/allure-report --clean

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/allure-report
