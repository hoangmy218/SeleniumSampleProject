# .github/workflows/test.yml
name: QA Test Suite - Event Triggered CI

on:
  push:
    branches: [ main, develop ]
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  pull_request:
    branches: [ main ]
  schedule:
    #Runs at 3:00 AM every weekday (Monday through Friday)
    - cron: '0 14 * * 1-5'
    - cron: '45 3 * * 0'

jobs:
  test:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Chrome
        run: |
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
      - name: Cache Maven dependencies
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Run tests
        run: mvn clean verify -Dbrowser=chrome -Dheadless=yes -Durl=${{ secrets.BASE_URL }} -Demail=${{ secrets.USER_EMAIL }} -Dpassword=${{ secrets.USER_PASSWORD }}
      - name: Build test report
        if: always()
        run: |
          npm install -g allure
          allure generate target/allure-results --environment=ubuntu-chrome --config allure3.js --output target/allure-report --clean

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: target
