services:

  # 1. Database PostgreSQL cho Integration Test
  postgres:
    image: postgres:16-alpine
    container_name: test-postgres-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Use the extension variables of the Postgres image to automatically create additional secondary databases
      POSTGRES_MULTIPLE_DATABASES: "chrome_db,firefox_db"
    ports:
      - "5432:5432"
    volumes:
      # (Optional) If want to use a custom script to create the database
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d main_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Selenium Hub
  selenium-hub:
    image: selenium/hub:4.51.0
    container_name: selenium-hub
    ports:
      - "4442:4442"
      - "4443:4443"
      - "4444:4444"

  # 3. Selenium Chrome Node
  chrome:
    image: selenium/node-chrome:156.0-20261101
    container_name: selenium-node-chrome
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    ports:
      - "6900:5900" # VNC port for viewing the live browser via VNC Viewer, if needed

  # 4. Selenium Firefox Node
  firefox:
    image: selenium/node-firefox:157.0-20261101
    container_name: selenium-node-firefox
    shm_size: 2gb
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
    ports:
      - "6901:5900"

  # 5. Test Runner (Java / Maven)
  tests-chrome:
    build: .
    container_name: test-runner-chrome
    depends_on:
      postgres:
        condition: service_healthy
      selenium-hub:
        condition: service_started
      chrome:
        condition: service_started
    environment:
      # Java code that sends requests through a central Hub instead of sending them directly to individual browser nodes
      - SELENIUM_URL=http://selenium-hub:4444/wd/hub
      - DB_URL=jdbc:postgresql://postgres:5432/chrome_db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    command: ["mvn", "verify", "-Dbrowser=chrome", "-Dheadless=yes"]
    volumes:
      - ./target-chrome:/app/target

  tests-firefox:
    build: .
    container_name: test-runner-firefox
    depends_on:
      postgres:
        condition: service_healthy
      selenium-hub:
        condition: service_started
      firefox:
        condition: service_started
    environment:
      - SELENIUM_URL=http://selenium-hub:4444/wd/hub
      - DB_URL=jdbc:postgresql://postgres:5432/firefox_db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    command: [ "mvn", "verify", "-Dbrowser=firefox", "-Dheadless=yes" ]
    volumes:
      - ./target-firefox:/app/target